name: API CD

on:
  workflow_run:
    workflows: ["API CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push commit image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/docker/prod.Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/ai-translate-api:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=ai-translate-api-prod
          cache-to: type=gha,mode=max,scope=ai-translate-api-prod

      - name: Make room for the commit release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail

            if [[ ! "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "ERROR: invalid commit SHA: $DEPLOY_SHA"
              exit 1
            fi

            DEPLOY_ROOT="$HOME/AITranslate/api"
            mkdir -p "$DEPLOY_ROOT"

            if [ -d "$DEPLOY_ROOT/$DEPLOY_SHA" ]; then
              echo "Release directory already exists for $DEPLOY_SHA."
              exit 0
            fi

            mapfile -t RELEASES < <(
              find "$DEPLOY_ROOT" -mindepth 1 -maxdepth 1 -type d \
                -printf '%T@ %f\n' \
                | awk '$2 ~ /^[a-f0-9]{40}$/ { print $0 }' \
                | sort -n \
                | awk '{ print $2 }'
            )

            while [ "${#RELEASES[@]}" -ge 2 ]; do
              OLDEST_SHA="${RELEASES[0]}"
              OLDEST_DIR="$DEPLOY_ROOT/$OLDEST_SHA"

              if [[ ! "$OLDEST_SHA" =~ ^[a-f0-9]{40}$ ]] || \
                 [ "$OLDEST_DIR" = "$DEPLOY_ROOT" ]; then
                echo "ERROR: refusing to remove unsafe release path: $OLDEST_DIR"
                exit 1
              fi

              echo "Removing oldest retained release $OLDEST_SHA."
              rm -rf -- "$OLDEST_DIR"
              RELEASES=("${RELEASES[@]:1}")
            done

      - name: Copy commit release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "api"
          target: "~/AITranslate/api/${{ github.event.workflow_run.head_sha }}/"
          strip_components: 1

      - name: Replace API stack with commit release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: >-
            DEPLOY_SHA,
            DOCKERHUB_USERNAME,
            DOCKERHUB_TOKEN,
            APP_VERSION,
            LOG_LEVEL,
            PORT,
            CORS_ORIGINS,
            POSTGRES_USER,
            POSTGRES_DB,
            DATABASE_URL,
            POSTGRES_PASSWORD,
            JWT_SECRET,
            OPENAI_API_KEY,
            OPENAI_MODEL,
            OPENAI_TRANSLATION_LANGUAGES,
            DEEPL_API_KEYS,
            TELEGRAM_BOT_API_KEY,
            TELEGRAM_CHAT_ID,
            TRANSLATE_PROMPT,
            INTERPRET_PROMPT,
            ANALYZE_PROMPT,
            MAX_TRANSLATION_CHARACTERS,
            LOKI_PORT,
            GRAFANA_PORT,
            GRAFANA_PASSWORD
          script: |
            set -euo pipefail

            require_value() {
              if [ -z "$2" ]; then
                echo "ERROR: $1 is empty"
                exit 1
              fi
            }

            if [[ ! "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "ERROR: invalid commit SHA: $DEPLOY_SHA"
              exit 1
            fi

            RELEASE_ID="${DEPLOY_SHA:0:12}"
            DEPLOY_ROOT="$HOME/AITranslate/api"
            DEPLOY_DIR="$DEPLOY_ROOT/$DEPLOY_SHA"
            STACK_NAME="ai-translate-api_stack"

            sync_secret() {
              local name="${1}_${RELEASE_ID}"
              local value="$2"
              require_value "$1" "$value"
              if ! docker secret inspect "$name" >/dev/null 2>&1; then
                printf '%s' "$value" | docker secret create "$name" -
              fi
            }

            sync_config() {
              local name="${1}_${RELEASE_ID}"
              local file="$2"
              if ! docker config inspect "$name" >/dev/null 2>&1; then
                docker config create "$name" "$file"
              fi
            }

            sync_config_value() {
              local name="${1}_${RELEASE_ID}"
              local value="$2"
              require_value "$1" "$value"
              if ! docker config inspect "$name" >/dev/null 2>&1; then
                printf '%s' "$value" | docker config create "$name" -
              fi
            }

            wait_for_stack_removal() {
              local attempts=0
              while docker service ls --format '{{.Name}}' \
                | grep -q "^${STACK_NAME}_"; do
                if [ "$attempts" -ge 60 ]; then
                  echo "ERROR: timed out waiting for $STACK_NAME services to stop"
                  exit 1
                fi
                sleep 2
                attempts=$((attempts + 1))
              done

              attempts=0
              while docker network inspect "${STACK_NAME}_internal" >/dev/null 2>&1; do
                if [ "$attempts" -ge 60 ]; then
                  echo "ERROR: timed out waiting for $STACK_NAME network removal"
                  exit 1
                fi
                sleep 2
                attempts=$((attempts + 1))
              done
            }

            require_value APP_VERSION "$APP_VERSION"
            require_value PORT "$PORT"
            require_value CORS_ORIGINS "$CORS_ORIGINS"
            require_value OPENAI_TRANSLATION_LANGUAGES "$OPENAI_TRANSLATION_LANGUAGES"
            require_value TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
            require_value LOKI_PORT "$LOKI_PORT"
            require_value GRAFANA_PORT "$GRAFANA_PORT"

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "ERROR: release directory does not exist: $DEPLOY_DIR"
              exit 1
            fi

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            sync_secret DATABASE_URL_FILE "$DATABASE_URL"
            sync_secret POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            sync_secret JWT_SECRET_FILE "$JWT_SECRET"
            sync_secret OPENAI_API_KEY_FILE "$OPENAI_API_KEY"
            sync_secret DEEPL_API_KEYS_FILE "$DEEPL_API_KEYS"
            sync_secret TELEGRAM_BOT_API_KEY_FILE "$TELEGRAM_BOT_API_KEY"
            sync_secret GRAFANA_PASSWORD "$GRAFANA_PASSWORD"

            sync_config loki_config "$DEPLOY_DIR/cfg/loki-config.yml"
            sync_config grafana_datasource "$DEPLOY_DIR/cfg/grafana-datasource.yml"
            sync_config_value TRANSLATE_PROMPT "$TRANSLATE_PROMPT"
            sync_config_value INTERPRET_PROMPT "$INTERPRET_PROMPT"
            sync_config_value ANALYZE_PROMPT "$ANALYZE_PROMPT"

            cd "$DEPLOY_DIR"

            export DOCKER_REGISTRY="$DOCKERHUB_USERNAME"
            export DEPLOY_SHA RELEASE_ID APP_VERSION LOG_LEVEL PORT CORS_ORIGINS
            export POSTGRES_USER POSTGRES_DB
            export OPENAI_MODEL OPENAI_TRANSLATION_LANGUAGES
            export TELEGRAM_CHAT_ID
            export MAX_TRANSLATION_CHARACTERS LOKI_PORT GRAFANA_PORT

            envsubst \
              '${DOCKER_REGISTRY} ${DEPLOY_SHA} ${RELEASE_ID} ${APP_VERSION} ${LOG_LEVEL} ${PORT} ${CORS_ORIGINS} ${POSTGRES_USER} ${POSTGRES_DB} ${OPENAI_MODEL} ${OPENAI_TRANSLATION_LANGUAGES} ${TELEGRAM_CHAT_ID} ${MAX_TRANSLATION_CHARACTERS} ${LOKI_PORT} ${GRAFANA_PORT}' \
              < docker/docker-compose.yml \
              > docker/docker-compose.resolved.yml

            if docker stack ls --format '{{.Name}}' | grep -Fxq "$STACK_NAME"; then
              echo "Stopping currently deployed stack."
              docker stack rm "$STACK_NAME"
              wait_for_stack_removal
            fi

            echo "Starting commit $DEPLOY_SHA."
            docker stack deploy \
              --with-registry-auth \
              --resolve-image always \
              -c docker/docker-compose.resolved.yml \
              "$STACK_NAME"

            echo "Waiting for migration and services to stabilize..."
            MAX_WAIT=30
            WAIT_COUNT=0

            until [ "$WAIT_COUNT" -ge "$MAX_WAIT" ]; do
              ALL_HEALTHY=true

              for SERVICE in \
                ai-translate-api_stack_api \
                ai-translate-api_stack_db \
                ai-translate-api_stack_loki \
                ai-translate-api_stack_grafana; do
                REPLICAS=$(docker service ls --filter name="$SERVICE" --format '{{.Replicas}}')
                RUNNING=$(echo "$REPLICAS" | cut -d/ -f1)
                DESIRED=$(echo "$REPLICAS" | cut -d/ -f2)
                FAILED=$(docker service ps "$SERVICE" \
                  --filter desired-state=running \
                  --no-trunc \
                  --format '{{.CurrentState}}' \
                  | grep -c Failed || true)

                if [ -z "$REPLICAS" ] || [ "$RUNNING" != "$DESIRED" ] || [ "$FAILED" -gt 0 ]; then
                  echo "[$WAIT_COUNT/$MAX_WAIT] $SERVICE not ready: $REPLICAS failed=$FAILED"
                  ALL_HEALTHY=false
                fi
              done

              MIGRATE_STATE=$(docker service ps ai-translate-api_stack_migrate \
                --no-trunc \
                --format '{{.CurrentState}}' \
                | head -1)
              if [[ "$MIGRATE_STATE" != Complete* ]]; then
                echo "[$WAIT_COUNT/$MAX_WAIT] migration not complete: $MIGRATE_STATE"
                ALL_HEALTHY=false
              fi

              if [ "$ALL_HEALTHY" = true ] && \
                curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${PORT}/health" >/dev/null; then
                echo "API deployment is healthy."
                break
              fi

              sleep 10
              WAIT_COUNT=$((WAIT_COUNT + 1))
            done

            if [ "$WAIT_COUNT" -ge "$MAX_WAIT" ]; then
              echo "ERROR: API deployment timed out"
              docker service ls
              docker service ps ai-translate-api_stack_api --no-trunc || true
              docker service ps ai-translate-api_stack_migrate --no-trunc || true
              exit 1
            fi

            mapfile -t PREVIOUS_RELEASES < <(
              find "$DEPLOY_ROOT" -mindepth 1 -maxdepth 1 -type d \
                -printf '%T@ %f\n' \
                | awk -v current="$DEPLOY_SHA" \
                  '$2 ~ /^[a-f0-9]{40}$/ && $2 != current { print $0 }' \
                | sort -nr \
                | head -1 \
                | awk '{ print $2 }'
            )
            KEPT_RELEASES=("$DEPLOY_SHA" "${PREVIOUS_RELEASES[@]}")

            is_kept_release_sha() {
              local candidate="$1"
              local release_sha
              for release_sha in "${KEPT_RELEASES[@]}"; do
                if [ "$candidate" = "$release_sha" ]; then
                  return 0
                fi
              done
              return 1
            }

            is_kept_release_id() {
              local candidate="$1"
              local release_sha
              for release_sha in "${KEPT_RELEASES[@]}"; do
                if [ "$candidate" = "${release_sha:0:12}" ]; then
                  return 0
                fi
              done
              return 1
            }

            while IFS= read -r release_dir; do
              release_name=$(basename "$release_dir")
              if [[ "$release_name" =~ ^[a-f0-9]{40}$ ]] && \
                 ! is_kept_release_sha "$release_name"; then
                echo "Removing surplus release $release_name."
                rm -rf -- "$release_dir"
              fi
            done < <(find "$DEPLOY_ROOT" -mindepth 1 -maxdepth 1 -type d)

            while IFS= read -r legacy_dir; do
              legacy_name=$(basename "$legacy_dir")
              if [[ ! "$legacy_name" =~ ^[a-f0-9]{40}$ ]] && \
                 [ -f "$legacy_dir/docker/docker-compose.resolved.yml" ]; then
                echo "Removing legacy tagged release $legacy_name."
                rm -rf -- "$legacy_dir"
              fi
            done < <(find "$DEPLOY_ROOT" -mindepth 1 -maxdepth 1 -type d)

            while IFS= read -r secret_name; do
              case "$secret_name" in
                DATABASE_URL_FILE_*|POSTGRES_PASSWORD_*|JWT_SECRET_FILE_*|OPENAI_API_KEY_FILE_*|DEEPL_API_KEYS_FILE_*|TELEGRAM_BOT_API_KEY_FILE_*|GRAFANA_PASSWORD_*)
                  secret_release_id="${secret_name##*_}"
                  if ! is_kept_release_id "$secret_release_id"; then
                    docker secret rm "$secret_name" || true
                  fi
                  ;;
              esac
            done < <(docker secret ls --format '{{.Name}}')

            while IFS= read -r config_name; do
              case "$config_name" in
                loki_config_*|grafana_datasource_*|TRANSLATE_PROMPT_*|INTERPRET_PROMPT_*|ANALYZE_PROMPT_*)
                  config_release_id="${config_name##*_}"
                  if ! is_kept_release_id "$config_release_id"; then
                    docker config rm "$config_name" || true
                  fi
                  ;;
              esac
            done < <(docker config ls --format '{{.Name}}')

            while IFS= read -r image_ref; do
              image_sha="${image_ref##*:}"
              keep_image=false
              for release_sha in "${KEPT_RELEASES[@]}"; do
                if [ "$image_sha" = "$release_sha" ]; then
                  keep_image=true
                  break
                fi
              done
              if [ "$keep_image" = false ]; then
                docker image rm "$image_ref" || true
              fi
            done < <(
              docker image ls \
                "$DOCKERHUB_USERNAME/ai-translate-api" \
                --format '{{.Repository}}:{{.Tag}}'
            )

            docker image prune -f
            echo "Deployed $DEPLOY_SHA; retained ${KEPT_RELEASES[*]}."
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APP_VERSION: ${{ vars.APP_VERSION || 'v1' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          PORT: ${{ vars.PORT || '4161' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'ai_translate' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'ai_translate' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-nano' }}
          OPENAI_TRANSLATION_LANGUAGES: ${{ vars.OPENAI_TRANSLATION_LANGUAGES }}
          DEEPL_API_KEYS: ${{ secrets.DEEPL_API_KEYS }}
          TELEGRAM_BOT_API_KEY: ${{ secrets.TELEGRAM_BOT_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TRANSLATE_PROMPT: ${{ vars.TRANSLATE_PROMPT }}
          INTERPRET_PROMPT: ${{ vars.INTERPRET_PROMPT }}
          ANALYZE_PROMPT: ${{ vars.ANALYZE_PROMPT }}
          MAX_TRANSLATION_CHARACTERS: ${{ vars.MAX_TRANSLATION_CHARACTERS || '10000' }}
          LOKI_PORT: ${{ vars.LOKI_PORT || '3100' }}
          GRAFANA_PORT: ${{ vars.GRAFANA_PORT || '3000' }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
