name: Extension CI

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-ci.yml"
      - ".github/workflows/extension-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-ci.yml"
      - ".github/workflows/extension-cd.yml"

permissions:
  contents: read

concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Type-check and package extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Build Chrome Web Store package
        run: npm run package:chrome

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(.output/*-chrome.zip)

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Chrome package, found ${#archives[@]}." >&2
            exit 1
          fi

          unzip -t "${archives[0]}"
          unzip -p "${archives[0]}" manifest.json \
            | jq -e '
                .manifest_version == 3 and
                (.name | type == "string" and length > 0) and
                (.version | type == "string" and test("^[0-9]+(\\.[0-9]+){0,3}$"))
              ' >/dev/null
