server {
    listen 80;
    listen [::]:80;

    server_name releases.ai-translate.bogdanantonovich.com;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name releases.ai-translate.bogdanantonovich.com;
    root /srv/www/releases.ai-translate.bogdanantonovich.com;

    ssl_certificate /etc/letsencrypt/live/releases.ai-translate.bogdanantonovich.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/releases.ai-translate.bogdanantonovich.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log off;

    add_header Cache-Control "private, no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Set-Cookie $ai_translate_release_cookie always;

    types {
        text/html html;
        text/javascript js;
        application/json json;
        application/zip zip;
    }
    default_type application/octet-stream;

    location = / {
        limit_except GET HEAD {
            deny all;
        }
        try_files /index.html =404;
    }

    location = /index.html {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri =404;
    }

    location = /download.js {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri =404;
    }

    location = /latest/ai-translate-extension.zip {
        if ($ai_translate_release_authorized = 0) {
            return 404;
        }

        limit_except GET HEAD {
            deny all;
        }
        try_files $uri =404;
    }

    location = /latest.json {
        if ($ai_translate_release_authorized = 0) {
            return 404;
        }

        limit_except GET HEAD {
            deny all;
        }
        try_files /latest/latest.json =404;
    }

    location / {
        return 404;
    }
}
