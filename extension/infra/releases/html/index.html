<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Translate Extension Download</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0b0d12;
        color: #f4f5f7;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid #2b303b;
        border-radius: 18px;
        background: #141821;
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      }
      h1 { margin: 0 0 12px; font-size: 1.65rem; }
      p { margin: 0 0 24px; color: #adb5c5; line-height: 1.55; }
      label { display: block; margin-bottom: 8px; font-weight: 650; }
      input, button {
        width: 100%;
        min-height: 46px;
        border-radius: 10px;
        font: inherit;
      }
      input {
        border: 1px solid #3b4251;
        padding: 0 13px;
        background: #0c0f15;
        color: #fff;
      }
      input:focus { outline: 2px solid #8ca9ff; outline-offset: 2px; }
      button {
        margin-top: 14px;
        border: 0;
        padding: 0 16px;
        background: #f4f5f7;
        color: #11131a;
        font-weight: 750;
        cursor: pointer;
      }
      button:disabled { cursor: wait; opacity: 0.65; }
      #status { min-height: 24px; margin: 14px 0 0; font-size: 0.9rem; }
      #status.error { color: #ff9d9d; }
    </style>
  </head>
  <body>
    <main>
      <h1>Download AI Translate</h1>
      <p>Enter the private access key to download the latest committed browser extension.</p>
      <form id="download-form">
        <label for="access-key">Access key</label>
        <input
          id="access-key"
          name="access-key"
          type="password"
          autocomplete="off"
          required
        />
        <button type="submit">Download latest extension</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="/download.js" defer></script>
  </body>
</html>
