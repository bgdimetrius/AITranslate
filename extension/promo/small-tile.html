<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440, initial-scale=1" />
    <title>AI Translator — Small promo tile</title>
    <link rel="stylesheet" href="./small-tile.css" />
  </head>
  <body>
    <main class="tile" aria-label="AI Translator promotional tile">
      <div class="texture" aria-hidden="true"></div>

      <section class="message">
        <p class="brand-name" id="brand-name"></p>
        <h1 id="headline"></h1>
      </section>

      <section class="hero" aria-label="AI Translator logo">
        <div class="reading-lines" id="reading-lines" aria-hidden="true"></div>
        <div class="logo-halo" aria-hidden="true"></div>
        <img class="hero-logo" src="../public/icon/128.png" alt="" />
      </section>
    </main>

    <script src="./small-tile.js"></script>
  </body>
</html>
